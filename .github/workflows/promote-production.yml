name: Promote Luna Image to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Seven-character commit tag published by the main build
        required: true
        type: string

concurrency:
  group: luna-production-promotion
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MANAGEMENT_INFRASTRUCTURE_ACCOUNT_ID: ${{ secrets.MANAGEMENT_INFRASTRUCTURE_ACCOUNT_ID }}
  AWS_ROLE_MANAGEMENT_INFRASTRUCTURE: ${{ secrets.AWS_ROLE_MANAGEMENT_INFRASTRUCTURE }}

jobs:
  authorize-production:
    name: Authorize Production Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an active administradores or ops team member
        env:
          GH_TOKEN: ${{ secrets.WORKLOADS_INFRASTRUCTURE_TOKEN }}
        run: |
          authorized=false
          for team in administradores ops; do
            state=$(curl --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/buyticketbrasil/teams/$team/memberships/$GITHUB_ACTOR" \
              | jq -r '.state // empty')
            if [ "$state" == "active" ]; then
              authorized=true
              break
            fi
          done

          if [ "$authorized" != "true" ]; then
            echo "$GITHUB_ACTOR is not an active member of administradores or ops" >&2
            exit 1
          fi

  promote-production:
    name: Open Production Deployment Values PR
    runs-on: ubuntu-latest
    needs: authorize-production
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate requested image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "image_tag must be a seven-character lowercase Git commit SHA" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_MANAGEMENT_INFRASTRUCTURE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.WORKLOADS_INFRASTRUCTURE_TOKEN }}

      - name: Resolve immutable image metadata
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image_digest=$(aws ecr describe-images \
            --repository-name luna \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --no-cli-pager)

          case "$image_digest" in
            sha256:*) ;;
            *) echo "invalid image digest: $image_digest" >&2; exit 1 ;;
          esac

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Update production values
        uses: mikefarah/yq@v4
        env:
          IMAGE_DIGEST: ${{ steps.meta.outputs.image_digest }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ env.MANAGEMENT_INFRASTRUCTURE_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        with:
          cmd: |
            yq -i '
              .api.image.repository = strenv(REGISTRY) + "/luna" |
              .api.image.tag = strenv(IMAGE_TAG) |
              .api.image.digest = strenv(IMAGE_DIGEST) |
              .api.datadog.version = strenv(IMAGE_TAG)
            ' deploy/helm/production/values.yaml

      - name: Open production deployment PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.WORKLOADS_INFRASTRUCTURE_TOKEN }}
          base: main
          add-paths: deploy/helm/production/values.yaml
          branch: deploy/production-luna-${{ inputs.image_tag }}
          delete-branch: true
          commit-message: "chore(luna): promote ${{ inputs.image_tag }} to production"
          title: "chore(luna): promote ${{ inputs.image_tag }} to production"
          body: |
            Promotes an immutable Luna image published from main to the
            production GitOps values.

            - image tag: `${{ inputs.image_tag }}`
            - image digest: `${{ steps.meta.outputs.image_digest }}`
            - Argo CD production sync: manual

            Merging this PR does not sync production automatically.

      - name: Write promotion summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          {
            echo "### Luna production promotion"
            echo
            echo "- Image tag: $IMAGE_TAG"
            echo "- Production values: deploy/helm/production/values.yaml"
            echo "- Change control: administrator-owned PR"
            echo "- Argo CD sync: manual"
          } >> "$GITHUB_STEP_SUMMARY"
